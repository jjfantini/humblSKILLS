version: 2

project_name: humblskills

before:
  hooks:
    - go -C cli mod tidy

builds:
  - id: humblskills
    # The CLI lives in a nested Go module (cli/go.mod); run the build from
    # inside it so module resolution works.
    dir: cli
    main: ./cmd/humblskills
    binary: humblskills
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

brews:
  # Stable formula. skip_upload: auto = do not touch this file on vX.Y.Z-pre.N.
  # `brew upgrade humblskills` stays on the last main release.
  - name: humblskills
    skip_upload: auto
    repository:
      owner: jjfantini
      name: homebrew-humbl
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/jjfantini/humblSKILLS
    description: Install agentskills.io-format skills into Claude Code, Cursor, and friends.
    license: CC-BY-4.0
    conflicts:
      - humblskills-pre
    commit_author:
      name: goreleaserbot
      email: goreleaser@users.noreply.github.com
    commit_msg_template: "humblskills: update to {{ .Tag }}"
    install: |
      bin.install "humblskills"
    test: |
      system "#{bin}/humblskills", "version"

  # Pre-release formula. Homebrew rejects `name@version` unless the suffix is
  # numeric (`python@3.12` → class PythonAT312); `humblskills@beta` is illegal.
  # Inverse of auto: upload only when the tag has a semver prerelease component.
  - name: humblskills-pre
    skip_upload: "{{ if .Prerelease }}false{{ else }}true{{ end }}"
    repository:
      owner: jjfantini
      name: homebrew-humbl
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/jjfantini/humblSKILLS
    description: Pre-release (develop) build of humblskills. Does not replace the stable formula.
    license: CC-BY-4.0
    conflicts:
      - humblskills
    commit_author:
      name: goreleaserbot
      email: goreleaser@users.noreply.github.com
    commit_msg_template: "humblskills-pre: update to {{ .Tag }}"
    install: |
      bin.install "humblskills"
    test: |
      system "#{bin}/humblskills", "version"

release:
  github:
    owner: jjfantini
    name: humblSKILLS
  draft: false
  prerelease: auto
  # Makes a failed release re-runnable. The default (keep-existing) 422s with
  # `Code:already_exists` on any asset the release already has, so a run that
  # dies AFTER uploading archives can never be retried: the rerun aborts on the
  # first duplicate upload, before `brews`, and the tap is never written.
  #
  # That is not hypothetical. On 2026-09-10 an expired HOMEBREW_TAP_TOKEN failed
  # v2.53.0-pre.1 at the brew step with a 401 — all 7 archives were already up.
  # After rotating the token the rerun failed again, this time on 7 duplicate
  # asset uploads, leaving humblskills-pre.rb pinned to the previous release.
  # Unsticking it would have meant deleting published assets by hand.
  #
  # `replace` deletes and re-uploads each asset instead, so a rerun converges.
  mode: replace
  header: |
    ## humblskills {{ .Version }}

    Install:
    - Shell: `curl -fsSL https://raw.githubusercontent.com/jjfantini/humblSKILLS/main/scripts/install.sh | sh`
    - Go: `go install github.com/jjfantini/humblSKILLS/cli/v2/cmd/humblskills@v{{ .Version }}`
    - Or download an archive for your platform below.

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge pull request"
