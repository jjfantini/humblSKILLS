name: release

# Two-branch path, one workflow. Not a second goreleaser entry-point.
#
#   develop → vX.Y.Z-pre.N GitHub pre-release. No brew.
#   main    → vX.Y.Z stable + Homebrew tap (jjfantini/homebrew-humbl).
#
# Manifests are split on purpose. Run 33548192550 on main:
#   Found release for path .: v2.52.0-pre sha 375eb41
#   Then only considered commits after that SHA
#   5c02a28 "Merge pull request #270 ..." could not be parsed
#   → "No user facing commits found since 375eb41 - skipping"
# Same package path `.` last-saw the GitHub pre-release. Feat/fix commits
# were already behind that tag. The promote merge is not conventional, so
# it cannot bump or graduate. Main must last-see the last *stable* tag.
#
#   develop → .release-please-manifest.develop.json  (last pre)
#   main    → .release-please-manifest.json          (last stable)
#
# Main then sees commits since vX.Y.Z (not vX.Y.Z-pre) and opens the stable
# PR for the same X.Y.Z. Do not write a `-pre` version into the main
# manifest. Do not invent tags in a second job.
#
# After a stable graduate, develop must not keep incrementing X.Y.Z-pre.N.
# `versioning: prerelease` on an already-prerelease last version only bumps
# the suffix (2.52.0-pre.3 → 2.52.0-pre.4). Semver: that pre is older than
# the stable, so beta = max(stable, pre) stays on vX.Y.Z. record_stable_on_develop
# rewrites the develop manifest to X.Y.Z so the next conventional commit
# opens X.Y.(Z+1)-pre.1 (fix) or X.(Y+1).0-pre.1 (feat). Do not hand-tag.
#
# Tag rule: the `-pre.N` suffix is semver-prerelease, so it cannot equal a
# stable `vX.Y.Z` tag. GitHub /releases/latest and `go install @latest`
# ignore prereleases. goreleaser `prerelease: auto` + `skip_upload: auto`
# consume the same suffix — pre tags update humblskills-pre only.
#
# workflow_dispatch re-runs GoReleaser for an existing tag (backfill).

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v2.51.0 or v2.52.0-pre.1"
        required: true

permissions:
  contents: write
  pull-requests: write

# Per-branch, never cancel. Two pushes to the same branch ~40s apart (feature
# merge, then the release PR it opened) must not overlap, and a half-finished
# goreleaser run must not be killed.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release_please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # RELEASE_PLEASE_TOKEN is a PAT on the `release` environment. A PAT-authored
    # release PR triggers downstream pull_request workflows (CI, auto-merge);
    # GITHUB_TOKEN-authored PRs do not.
    environment: release
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: ${{ github.ref_name == 'develop' && 'release-please-config.develop.json' || 'release-please-config.json' }}
          manifest-file: ${{ github.ref_name == 'develop' && '.release-please-manifest.develop.json' || '.release-please-manifest.json' }}
          target-branch: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  goreleaser:
    needs: release_please
    if: |
      always() && (
        (github.event_name == 'push' && needs.release_please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    # HOMEBREW_TAP_TOKEN is an environment secret. Unused on pre-release tags
    # (goreleaser skip_upload: auto) but still required to be present.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ needs.release_please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.resolve.outputs.tag }}
          # PAT: GITHUB_TOKEN cannot push tags that point at commits touching
          # .github/workflows/ (needs the `workflows` permission).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Push sibling cli/* tag for go install
        # Nested module: `cli/go.mod` is `github.com/jjfantini/humblSKILLS/cli/v2`,
        # so `go install .../cli/v2/cmd/humblskills@vX.Y.Z` needs `cli/vX.Y.Z`
        # on the same commit as `vX.Y.Z`. At v3, move the module path to `/v3`.
        run: |
          set -eu
          ver="${{ steps.resolve.outputs.tag }}"
          sibling="cli/${ver}"
          if git rev-parse -q --verify "refs/tags/${sibling}" >/dev/null; then
            echo "sibling tag ${sibling} already exists - skipping"
            exit 0
          fi
          git tag "${sibling}" HEAD
          git push origin "${sibling}"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: cli/go.sum

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # After vX.Y.Z is tagged on main, develop's last-released version must
  # become X.Y.Z (not X.Y.Z-pre.N). Otherwise versioning: prerelease keeps
  # cutting 2.52.0-pre.N, which loses to 2.52.0 for every beta user.
  # PAT so the push can trigger develop's release.yml (GITHUB_TOKEN cannot).
  record_stable_on_develop:
    needs: release_please
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.release_please.outputs.release_created == 'true' &&
      !contains(needs.release_please.outputs.tag_name, '-pre')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Record graduated stable on develop pre line
        env:
          TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          git fetch origin develop
          git checkout -B develop origin/develop
          if git merge-base --is-ancestor HEAD origin/main; then
            git merge --ff-only origin/main
          fi
          scripts/sync-develop-pre-after-stable.sh --stable "$ver" --write
          if git diff --quiet -- .release-please-manifest.develop.json; then
            echo "develop pre line already past ${ver}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-please-manifest.develop.json
          git commit -m "chore(release): record graduated v${ver} on develop pre line"
          git push origin HEAD:develop
