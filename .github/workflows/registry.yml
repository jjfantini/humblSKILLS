name: Registry

# Self-healing registry.json. Runs on branch pushes whose paths could affect
# the generated registry. If drift is detected, regenerates and commits back to
# the pushed branch. This replaces the former pre-merge "registry-check" gate —
# drift is now auto-fixed rather than blocking merges.
#
# The auto-fix commit must re-trigger CI. It used to carry [skip ci] and be
# pushed with GITHUB_TOKEN, which suppressed downstream workflows twice over.
# On any PR touching skills/ that commit is the head, so the merged content was
# never tested — and once main requires status checks, those PRs would block
# forever waiting for a run that can never start.
#
# Pushing with the PAT and no [skip ci] means this workflow re-triggers on its
# own commit. That does not loop, but only because build-registry now leaves
# registry.json untouched when nothing semantic changed: the second run
# regenerates, finds no diff, and exits at "already in sync".
#
# That property is load-bearing here. It did not hold before — generated_at and
# source.ref/sha were rewritten on every run, so the early exit was unreachable
# and this workflow would push on every trigger, forever. If build-registry ever
# goes back to writing unconditionally, this becomes an infinite push loop.
#
# There is exactly one sanctioned exception, and this job is what applies it: a
# source.sha that predates a skill registry.json already lists. `make registry`
# reads the working tree but stamps source.sha from HEAD, so the commit that
# first adds a skill records a SHA that cannot contain it, and install then
# fails with "no files found under skills/<name> in tarball". build-registry
# rewrites in that case only, and only when the new SHA actually resolves every
# skill — so it converges after one push rather than looping. See
# sourceSHAVerdict in cli/cmd/build-registry/main.go.

on:
  push:
    # Branch pushes only. Tag pushes (e.g. the vX.Y.Z / cli/vX.Y.Z release tags)
    # check out a detached ref with nowhere to push, so they must NOT run here.
    branches:
      - "**"
    paths:
      - "skills/**"
      - "cli/cmd/build-registry/**"
      - "cli/internal/**"
      - "cli/go.mod"
      - "cli/go.sum"

permissions:
  contents: write

concurrency:
  # Per-branch so a PR push does not block a simultaneous main push.
  group: registry-rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    # Still skip the legacy github-actions[bot] identity; the PAT push now
    # runs as a human actor, so the real loop protection is the "already in
    # sync" exit below, not this condition.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # RELEASE_PLEASE_TOKEN is an environment secret on `release`.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch explicitly so `git push` knows where to
          # send the auto-fix commit (avoids detached-HEAD push failures
          # on PR branches).
          ref: ${{ github.ref_name }}
          # A GITHUB_TOKEN push does not trigger workflows, so CI would never
          # run on the auto-fix commit.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Full history, not the default depth-1. Two steps here need commits
          # other than the tip: build-registry resolves the *recorded*
          # source.sha to check it contains every skill (on a shallow clone
          # that object is absent, git errors, and the check silently declines
          # to fire), and the push-retry below does `git reset --hard HEAD~1`,
          # which has no parent to reach at depth 1.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: cli/go.sum

      - name: Rebuild and push registry.json (race-safe)
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Regenerate, commit, and push. If another push (e.g. a sibling merge
          # during a release) advances the branch first, our push is a
          # non-fast-forward and is rejected. Re-sync to the remote tip and
          # retry — the regeneration is deterministic, so it converges quickly.
          for attempt in 1 2 3 4 5; do
            make registry

            if git diff --quiet -- registry.json; then
              echo "registry.json already in sync; nothing to commit."
              exit 0
            fi

            git add registry.json
            git commit -m "chore(registry): regenerate registry.json"

            if git push origin "HEAD:${REF}"; then
              echo "pushed regenerated registry.json (attempt ${attempt})"
              exit 0
            fi

            echo "push rejected (attempt ${attempt}); re-syncing to origin/${REF} and retrying"
            git reset --hard "HEAD~1"
            git fetch origin "${REF}"
            git reset --hard FETCH_HEAD
          done

          echo "::error::failed to push registry.json after 5 attempts"
          exit 1
