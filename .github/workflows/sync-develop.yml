name: Sync develop

# After a main release, release-please commits changelog + manifest on main.
# Fast-forward develop so it is not left behind. Plain push, never --force:
# if develop has unmerged work the push is a non-fast-forward and is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-develop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward develop to main
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor origin/develop origin/main; then
            git push origin "origin/main:refs/heads/develop"
            echo "develop fast-forwarded to $(git rev-parse --short origin/main)"
          else
            ahead=$(git rev-list --count origin/main..origin/develop)
            echo "::notice::develop has ${ahead} commit(s) not on main; leaving it alone."
          fi
